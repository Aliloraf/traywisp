name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TrayWisp.slnx

      - name: Build
        run: dotnet build TrayWisp.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution TrayWisp.slnx --configuration Release --no-build
        env:
          # The runner provides Windows PowerShell 5.1, PowerShell 7, Python 3 and Node.js, so the real-interpreter
          # tests are required here: a missing or blocked interpreter fails them instead of skipping them.
          TRAYWISP_REQUIRED_INTERPRETERS: all
          # Process scope only, for this test invocation: lets the locally created test scripts run. It changes no
          # user or machine policy, and the production engine never sets one (see docs/execution-engine.md, "Tests").
          PSExecutionPolicyPreference: RemoteSigned
